name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Install Remotion browser runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libnspr4 \
            libnss3 \
            libgtk-3-0 \
            libgbm1 \
            libasound2t64 \
            libxshmfence1 \
            fonts-noto
      - run: npm run browser:ensure
      - run: npm run render:smoke
      - run: npm run api:smoke
