services:
  wheelofnames:
    build: .
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      API_TOKEN: change-me
      MAX_CONCURRENT_RENDERS: 1
      RENDER_TIMEOUT_MS: 15000
      MAX_OPTIONS: 32
      MAX_OPTION_CHARS: 40
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
