services:
  bot:
    build:
      context: .
    # Or pin a prebuilt image instead of building:
    #   image: ghcr.io/tiennm99/miti99bot:latest
    restart: unless-stopped
    environment:
      # --- Required ---
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      MONGO_URL: ${MONGO_URL}              # Atlas SRV string incl. credentials — SECRET
      MONGO_DATABASE: ${MONGO_DATABASE}
      # --- Operational ---
      MODULES: ${MODULES}                  # CSV; empty = all modules
      OWNER_ID: ${OWNER_ID}                # Telegram user id for owner-only commands
      ADMIN_IDS: ${ADMIN_IDS}              # CSV of admin Telegram user ids
      # The bundled renderer service below draws /wheelofnames, /gacha and
      # /genshin. The URL is fixed to its in-network address so a stale
      # platform-level value cannot point the bot elsewhere; /gacha and
      # /genshin derive their endpoints from it.
      WHEELOFNAMES_API_URL: http://renderer:3000/api/gif
      # SOURCE_COMMIT is intentionally not declared here. Coolify provides it
      # at runtime via its generated env file; declaring it here with Compose
      # interpolation can override the runtime value with an empty string.
      # Storage auto-selects mongodb because MONGO_URL is set — no KV_PROVIDER.
      # The in-process cron scheduler runs by default — no CRON_MODE.
      # PORT defaults to 8080 (internal health server) — omit unless overriding.
      # Long polling = no TELEGRAM_WEBHOOK_SECRET, no /webhook, no public domain.
      # Cron is in-process only — there is no /cron HTTP route and no secret.
      # No stock/coin/gold URL env overrides — modules use their coded default
      # providers (stock: SSI/VCI/KBS; coin: Binance->Coinbase->CoinGecko;
      # gold: VNAppMob). If GOLD_VNAPP_API_KEY is unset, the bot auto-fetches
      # and caches a key to Mongo.
    # Long polling is outbound-only: nothing inbound to route, so no published
    # ports and no public domain. `expose` keeps :8080 reachable inside the
    # Coolify network for the container health monitor against GET / only.
    expose:
      - "8080"
    # No compose healthcheck: Coolify's own HTTP monitor covers it, so none is
    # defined here. Configure that monitor against GET / instead
    # (returns text/plain "miti99bot ok"). Note: a plain / check does not verify
    # Mongo connectivity — see docs/deploy-coolify-selfhosted.md.

  # Animation renderer (Node + Remotion + headless Chrome) from renderer/.
  # Internal only: the bot reaches it over the compose network, so it has no
  # published port, no public domain, and no auth token. Never publish a port
  # or attach a domain to it — its API is unauthenticated.
  renderer:
    build:
      context: ./renderer
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      MAX_CONCURRENT_RENDERS: ${MAX_CONCURRENT_RENDERS:-1}
      RENDER_TIMEOUT_MS: ${RENDER_TIMEOUT_MS:-15000}
      MAX_OPTIONS: ${MAX_OPTIONS:-32}
      MAX_OPTION_CHARS: ${MAX_OPTION_CHARS:-40}
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
